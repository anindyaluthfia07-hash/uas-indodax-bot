name: indodax-dry-run-tick

# Penjadwal utama: setiap 4 jam pada menit ke-7 UTC.
# Candle 4 jam Indodax ditutup pada 00:00, 04:00, ... UTC, jadi tick jatuh
# beberapa menit setelah candle tertutup.
#
# Tick dijalankan langsung di runner GitHub Actions memakai penyimpanan file
# (`data/local/*.jsonl`), lalu hasilnya di-commit kembali ke repo. Repo menjadi
# penyimpanan persisten yang bisa diaudit lewat riwayat git, dan setiap commit
# memicu redeploy Vercel sehingga dashboard selalu menampilkan data terbaru.
#
# Periode forward test ditetapkan dari tick pertama sampai
# 2026-11-14T05:00:00Z (14 Nov 2026 12.00 WIB). Setelah waktu itu workflow
# berhenti melakukan tick, menyegarkan laporan sekali lagi, lalu menulis
# `data/forward_period_closed.json`. Selama marker itu ada, seluruh job tidak
# menambah data baru.
#
# Jalur Upstash + `POST /api/tick` tetap tersedia (lihat docs/DEPLOYMENT.md);
# aktif otomatis bila secret UPSTASH_REDIS_REST_URL/TOKEN dan variabel
# VERCEL_URL diisi. Tanpa itu, workflow memakai mode repo di bawah.
on:
  schedule:
    - cron: "7 */4 * * *"
    # Satu kali setelah periode berakhir (05:07 UTC = 12:07 WIB, 14 Nov 2026)
    # untuk menyegarkan laporan terakhir dan menulis marker penutupan.
    - cron: "7 5 14 11 *"
  workflow_dispatch:

concurrency:
  group: indodax-dry-run-tick
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      VERCEL_URL: ${{ vars.VERCEL_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cek status periode forward test
        id: period
        run: |
          set -euo pipefail
          if [ -f data/forward_period_closed.json ]; then
            echo "closed=true" >> "$GITHUB_OUTPUT"
            echo "ended=true" >> "$GITHUB_OUTPUT"
            echo "Periode sudah ditutup (marker ada). Tidak ada tick baru."
          else
            echo "closed=false" >> "$GITHUB_OUTPUT"
            ended=$(python3 -c "from core.period import forward_period; print('true' if forward_period()['complete'] else 'false')")
            echo "ended=$ended" >> "$GITHUB_OUTPUT"
            echo "Periode berakhir: $(python3 -c "from core.period import FORWARD_TEST_END; print(FORWARD_TEST_END)")"
            echo "Sudah berakhir: $ended"
          fi

      - name: Jalankan tick
        id: tick
        if: steps.period.outputs.closed != 'true' && steps.period.outputs.ended != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_URL:-}" ] && [ -n "${UPSTASH_REDIS_REST_URL:-}" ]; then
            echo "Mode cloud API: $VERCEL_URL/api/tick"
            code=$(curl -sS -o /tmp/tick.json -w "%{http_code}" -X POST \
              "$VERCEL_URL/api/tick" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -H "User-Agent: github-actions-indodax-bot" \
              --max-time 120)
            cat /tmp/tick.json
            echo
            [ "$code" = "200" ] || { echo "Tick gagal HTTP $code" >&2; exit 1; }
          else
            echo "Mode repo: tick langsung di runner, state di data/local/"
            python3 scripts/run_tick.py --trigger github_actions --no-snapshots
          fi

      - name: Segarkan analisis, dashboard, dan laporan
        if: always() && steps.period.outputs.closed != 'true'
        run: |
          set -uo pipefail
          python3 scripts/gap_analysis.py --source local || true
          python3 scripts/recompute.py --source local || true
          python3 scripts/build_offline_dashboard.py || true
          python3 scripts/build_report.py || true

      - name: Tutup periode forward test
        if: always() && steps.period.outputs.closed != 'true' && steps.period.outputs.ended == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from core.period import FORWARD_TEST_END
          payload = {
              "closed_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "period_end": FORWARD_TEST_END,
              "reason": "Periode forward test berakhir; tick otomatis dihentikan.",
          }
          with open("data/forward_period_closed.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(json.dumps(payload, indent=2))
          PY

      - name: Commit hasil tick
        if: always() && steps.period.outputs.closed != 'true'
        run: |
          set -euo pipefail
          git config user.name "Anindya Rahma Luthfia"
          git config user.email "anindyaluthfia07-hash@users.noreply.github.com"
          git add data public docs/LAPORAN_AKHIR.md dashboard_offline.html
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "tick(cloud): $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Ringkasan job
        if: always()
        run: |
          {
            echo "## Tick Indodax"
            echo ""
            echo "- Waktu UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Mode: ${VERCEL_URL:+cloud API}${VERCEL_URL:-repo (runner)}"
            echo "- Commit: $(git rev-parse --short HEAD)"
            echo "- Tick terakhir: $(python3 -c "import json;s=json.load(open('data/local/state.json'));print(s.get('last_tick'), '| tick_count', s.get('tick_count'))")"
          } >> "$GITHUB_STEP_SUMMARY"
